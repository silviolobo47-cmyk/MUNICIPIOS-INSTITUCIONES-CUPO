<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C5D8C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cupos">
<title>Cupos de Pases — Sección Discapacidad</title>
<style>
  :root{
    --bg: #EEF1F3;
    --paper: #FFFFFF;
    --ink: #1B2733;
    --ink-soft: #5B6B7A;
    --blue: #1C5D8C;
    --blue-dark: #123F5F;
    --green: #2F7D5C;
    --green-bg: #E6F2EC;
    --red: #B23B3B;
    --red-bg: #F6E8E8;
    --line: #D7DDE2;
    --dot-empty: #C7CDD3;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 4px 22px;
  }
  header.top .brand{display:flex;align-items:center;gap:10px;}
  header.top .isa{
    width:34px;height:34px;border-radius:50%;
    background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;flex-shrink:0;
  }
  header.top h1{font-size:16px;margin:0;line-height:1.2;letter-spacing:.2px;}
  header.top .sub{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  header.top button.logout{
    border:none;background:none;color:var(--ink-soft);
    font-size:13px;text-decoration:underline;padding:6px;cursor:pointer;
  }

  /* --- LOGIN --- */
  .login-card{
    background:var(--paper);border-radius:var(--radius);
    padding:36px 24px;text-align:center;
    box-shadow:0 1px 3px rgba(27,39,51,.08);
    margin-top:40px;
  }
  .login-card .isa-big{
    width:56px;height:56px;border-radius:50%;background:var(--blue);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:24px;margin:0 auto 16px;
  }
  .login-card h2{font-size:18px;margin:0 0 4px;}
  .login-card p{font-size:13px;color:var(--ink-soft);margin:0 0 24px;}
  .pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:24px;}
  .pin-dots span{
    width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);
    display:inline-block;transition:background .15s;
  }
  .pin-dots span.filled{background:var(--blue);}
  .keypad{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    max-width:260px;margin:0 auto;
  }
  .keypad button{
    padding:16px 0;font-size:19px;border-radius:12px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .keypad button:active{background:var(--bg);}
  .keypad button.wide{grid-column:span 1;color:var(--ink-soft);font-size:14px;}
  .login-error{color:var(--red);font-size:13px;margin-top:14px;min-height:16px;}

  /* --- STATUS BANNER --- */
  .banner{
    font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:16px;
    display:flex;align-items:center;gap:8px;
  }
  .banner.offline{background:#FCEFD9;color:#8A5A00;}
  .banner.error{background:var(--red-bg);color:var(--red);}

  /* --- MUNICIPIO CARD (motivo ticket perforado) --- */
  .card{
    background:var(--paper);border-radius:var(--radius);
    margin-bottom:14px;position:relative;overflow:hidden;
    box-shadow:0 1px 3px rgba(27,39,51,.07);
    display:flex;
  }
  .card .stub{
    width:100px;flex-shrink:0;
    background:var(--blue);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;padding:12px 6px;
  }
  .card.full .stub{background:var(--red);}
  .card.medio .stub{background:#B8860B;}
  .card .stub .num{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .card .stub .num small{font-size:12px;font-weight:500;opacity:.85;}
  .card .stub .label{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;opacity:.9;margin-top:4px;text-align:center;}
  .perf{
    width:0;border-left:2px dashed rgba(255,255,255,.55);
    position:absolute;right:0;top:8px;bottom:8px;
  }
  .card .body{flex:1;padding:14px 16px;min-width:0;}
  .card .body h3{margin:0 0 8px;font-size:15.5px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
  .dots i{
    width:9px;height:9px;border-radius:50%;
    background:var(--dot-empty);display:inline-block;
  }
  .dots i.on{background:var(--blue);}
  .card.full .dots i.on{background:var(--red);}
  .card.medio .dots i.on{background:#B8860B;}
  .card .meta{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;}
  .status-pill{
    font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
  }
  .status-pill.open{background:var(--green-bg);color:var(--green);}
  .status-pill.closed{background:var(--red-bg);color:var(--red);}
  .status-pill.medio{background:#FCEFD9;color:#8A5A00;}

  .warn-strip{
    font-size:11.5px;font-weight:600;padding:6px 16px;
    display:flex;align-items:center;gap:6px;
  }
  .warn-strip.amber{background:#FCEFD9;color:#8A5A00;}
  .warn-strip.red{background:var(--red-bg);color:var(--red);}

  .card.admin{cursor:pointer;}
  .card.admin:active{background:#FAFBFC;}

  /* --- ADMIN CONTROLS --- */
  .fab{
    position:fixed;right:20px;bottom:24px;
    width:54px;height:54px;border-radius:50%;
    background:var(--blue);color:#fff;border:none;
    font-size:26px;box-shadow:0 4px 12px rgba(28,93,140,.4);
    cursor:pointer;
  }
  .modal-bg{
    position:fixed;inset:0;background:rgba(27,39,51,.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal{
    background:#fff;border-radius:18px 18px 0 0;padding:22px 20px 28px;
    width:100%;max-width:640px;
  }
  .modal h3{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field input{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    font-size:15px;font-family:inherit;
  }
  .modal .actions{display:flex;gap:10px;margin-top:18px;}
  .modal .actions button{
    flex:1;padding:13px;border-radius:10px;border:none;font-size:14.5px;font-weight:600;cursor:pointer;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-danger{background:var(--red-bg);color:var(--red);}
  .btn-ghost{background:var(--bg);color:var(--ink-soft);}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;}

  /* --- PUBLIC VIEW --- */
  .public-hero{text-align:center;padding:30px 10px 10px;}
  .public-hero .isa-big{
    width:60px;height:60px;border-radius:50%;background:var(--blue);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:26px;margin:0 auto 14px;
  }
  .public-hero h2{font-size:19px;margin:0 0 2px;}
  .public-hero p{font-size:12.5px;color:var(--ink-soft);margin:0;}

  /* --- PUBLIC LOOKUP FORM --- */
  .lookup-card{
    background:var(--paper);border-radius:var(--radius);
    padding:24px 20px;margin-top:10px;
    box-shadow:0 1px 3px rgba(27,39,51,.08);
  }
  .lookup-card select, .lookup-card input{
    width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
    font-size:15px;font-family:inherit;margin-bottom:12px;background:#fff;
  }
  .lookup-card button{
    width:100%;padding:13px;border-radius:10px;border:none;
    background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  }
  .lookup-error{color:var(--red);font-size:13px;margin-top:10px;text-align:center;}
  .back-link{
    display:inline-block;margin-top:16px;font-size:13px;color:var(--blue);
    text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;
  }
</style>
</head>

<div id="app" class="wrap"></div>

<script>
// ============ CONFIG ============

// ============ HELPERS ============
function saveCache(rows){ localStorage.setItem(CACHE_KEY, JSON.stringify({rows, ts: Date.now()})); }
function loadCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ return null; } }

function dotsHtml(total, filled){
  let h = '';
  for(let i=0;i<total;i++){ h += `<i class="${i<filled?'on':''}"></i>`; }
  return h;
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}

const MS_DIA = 1000*60*60*24;
function diasSinPresentar(iso){
  if(!iso) return 0;
  return Math.floor((Date.now() - new Date(iso).getTime()) / MS_DIA);
}
function warningHtml(iso){
  const dias = diasSinPresentar(iso);
  if(dias >= 30){
    return `<div class="warn-strip red">⚠ Sin presentaciones hace ${dias} días — dado de baja del sistema</div>`;
  }
  if(dias >= 15){
    return `<div class="warn-strip amber">⚠ Sin presentaciones hace ${dias} días</div>`;
  }
  return '';
}

// Estado visual del ticket según nivel de ocupación
// verde: menos de la mitad ocupado | amarillo: mitad o más | rojo: completo (cupo lleno)
function estadoCupo(cupo_total, presentados){
  const ratio = cupo_total > 0 ? presentados / cupo_total : 0;
  if(presentados >= cupo_total) return { clase:'full', pill:'closed', texto:'Ocupado' };
  if(ratio >= 0.5) return { clase:'medio', pill:'medio', texto:'Por completarse' };
  return { clase:'', pill:'open', texto:'Disponible' };
}

// ============ TICKET (se muestra luego de validar el código) ============
function renderTicket(body, data){
  const estado = estadoCupo(data.cupo_total, data.presentados_constancia);
  body.innerHTML = `
    <div class="card ${estado.clase}" style="flex-direction:column;">
      <div style="display:flex;">
        <div class="stub">
          <div class="num">${data.remanente}<small>/${data.cupo_total}</small></div>
          <div class="label">Remanente</div>
          <div class="perf"></div>
        </div>
        <div class="body">
          <h3>${data.municipio}</h3>
          <div class="dots">${dotsHtml(data.cupo_total, data.presentados_constancia)}</div>
          <div class="meta">
            <span class="status-pill ${estado.pill}">${estado.texto}</span>
            <span>Act. ${fmtDate(data.actualizado)}</span>
          </div>
        </div>
      </div>
      ${warningHtml(data.ultima_presentacion)}
    </div>
    <p style="font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:18px;">
      ${data.presentados_constancia}/${data.cupo_total} constancias — de ${data.pases_asignados || 20} pases totales asignados.
    </p>`;
}

// ============ PUBLIC LOOKUP (un solo link + código, con municipio precargado opcional) ============
async function renderLookup(){
  const preset = params.get('municipio') || params.get('m'); // ?municipio=slug precarga el desplegable
  app.innerHTML = `<div class="public-hero">
      <div class="isa-big">♿</div>
      <h2>Cupo de pases</h2>
      <p>${preset ? 'Ingresá tu código de acceso' : 'Seleccioná tu municipio e ingresá tu código'}</p>
    </div>
    <div id="lookup-body" style="margin-top:10px;"></div>`;
  const body = document.getElementById('lookup-body');
  body.innerHTML = `<div class="lookup-card"><div class="empty" style="padding:20px;">Cargando municipios...</div></div>`;

  const { data, error } = await sb.from('cupos_municipios').select('municipio,slug').eq('activo', true).order('municipio');
  if(error || !data){
    body.innerHTML = `<div class="banner error">No se pudo conectar. Probá de nuevo en unos minutos.</div>`;
    return;
  }

  body.innerHTML = `
    <div class="lookup-card">
      <select id="sel-municipio">
        <option value="">Elegí tu municipio...</option>
        ${data.map(m=>`<option value="${m.slug}">${m.municipio}</option>`).join('')}
      </select>
      <input type="text" id="inp-codigo" placeholder="Código de acceso (4 dígitos)" inputmode="numeric" maxlength="4">
      <button id="btn-consultar">Consultar mi cupo</button>
      <div class="lookup-error" id="lookup-error"></div>
    </div>`;

  const selEl = document.getElementById('sel-municipio');
  const codigoEl = document.getElementById('inp-codigo');
  if(preset && data.some(m=>m.slug===preset)){
    selEl.value = preset;
    codigoEl.focus();
  }

  document.getElementById('btn-consultar').onclick = async ()=>{
    const slug = document.getElementById('sel-municipio').value;
    const codigo = document.getElementById('inp-codigo').value.trim();
    const errEl = document.getElementById('lookup-error');
    errEl.textContent = '';
    if(!slug){ errEl.textContent = 'Elegí tu municipio de la lista.'; return; }
    if(!codigo){ errEl.textContent = 'Ingresá tu código de acceso.'; return; }

    const { data: rec, error: err2 } = await sb.from('cupos_municipios').select('*').eq('slug', slug).eq('codigo', codigo).eq('activo', true).single();
    if(err2 || !rec){
      errEl.textContent = 'Código incorrecto para ese municipio.';
      return;
    }
    app.innerHTML = `<div class="public-hero">
        <div class="isa-big">♿</div>
        <h2>Cupo de pases</h2>
        <p>Consulta de disponibilidad para presentar constancias</p>
      </div>
      <div id="public-body" style="margin-top:20px;"></div>`;
    const resultBody = document.getElementById('public-body');
    renderTicket(resultBody, rec);
    const back = document.createElement('button');
    back.className = 'back-link';
    back.textContent = '← Consultar otro municipio';
    back.onclick = renderLookup;
    resultBody.appendChild(back);
  };
}

// ============ LOGIN ============
function renderLogin(){
  let pin = '';
  app.innerHTML = `
    <div class="login-card">
      <div class="isa-big">♿</div>
      <h2>Panel de cupos</h2>
      <p>Ingresá tu PIN de acceso</p>
      <div class="pin-dots" id="pin-dots">
        ${'<span></span>'.repeat(4)}
      </div>
      <div class="keypad" id="keypad"></div>
      <div class="login-error" id="login-error"></div>
    </div>`;

  const dotsEl = document.getElementById('pin-dots').children;
  const errEl = document.getElementById('login-error');
  const keypad = document.getElementById('keypad');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keypad.innerHTML = keys.map(k => `<button class="${k===''?'wide':''}" data-k="${k}" ${k===''?'disabled style="visibility:hidden"':''}>${k}</button>`).join('');

  function updateDots(){
    for(let i=0;i<4;i++){ dotsEl[i].classList.toggle('filled', i < pin.length); }
  }

  keypad.addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn || btn.disabled) return;
    const k = btn.dataset.k;
    errEl.textContent = '';
    if(k === '⌫'){ pin = pin.slice(0,-1); updateDots(); return; }
    if(pin.length >= 4) return;
    pin += k;
    updateDots();
    if(pin.length === 4){
      setTimeout(()=>{
        if(pin === ADMIN_PIN){
          sessionStorage.setItem('cupos_admin','1');
          session.authed = true;
          renderAdmin();
        } else {
          errEl.textContent = 'PIN incorrecto';
          pin = '';
          updateDots();
        }
      }, 150);
    }
  });
}

// ============ ADMIN ============
let municipios = [];

async function fetchMunicipios(){
  try{
    const { data, error } = await sb.from('cupos_municipios').select('*').order('remanente', {ascending:true});
    if(error) throw error;
    municipios = data;
    saveCache(data);
    return { ok:true };
  }catch(e){
    const cache = loadCache();
    if(cache){ municipios = cache.rows; return { ok:false, cached:true }; }
    return { ok:false, cached:false };
  }
}

async function renderAdmin(){
  app.innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="isa">♿</div>
        <div>
          <h1>Cupos de Pases</h1>
          <div class="sub">Sección Discapacidad</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <button class="logout" id="historial-btn">Control mensual</button>
        <button class="logout" id="logout-btn">Salir</button>
      </div>
    </header>
    <div id="banner-slot"></div>
    <div id="list"></div>
    <button class="fab" id="add-btn">＋</button>`;

  document.getElementById('logout-btn').onclick = ()=>{
    sessionStorage.removeItem('cupos_admin');
    session.authed = false;
    renderLogin();
  };
  document.getElementById('add-btn').onclick = ()=> openAddModal();
  document.getElementById('historial-btn').onclick = ()=> renderHistorial();

  const list = document.getElementById('list');
  list.innerHTML = `<div class="empty">Cargando...</div>`;

  const res = await fetchMunicipios();

  if(!res.ok){
    bannerSlot.innerHTML = res.cached
      ? `<div class="banner offline">Sin conexión — mostrando últimos datos guardados</div>`
      : `<div class="banner error">No se pudo conectar y no hay datos guardados en este dispositivo</div>`;
  }

  renderList();
}

// ============ CONTROL MENSUAL (historial) ============
async function renderHistorial(){
  app.innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="isa">♿</div>
        <div>
          <h1>Control mensual</h1>
          <div class="sub">Presentaciones por mes cerrado</div>
        </div>
      </div>
      <button class="logout" id="volver-btn">Volver</button>
    </header>
    <div id="hist-body"><div class="empty">Cargando...</div></div>`;

  document.getElementById('volver-btn').onclick = ()=> renderAdmin();

  const body = document.getElementById('hist-body');
  const { data, error } = await sb.from('cupos_historial').select('*').order('mes', {ascending:false}).order('municipio');
  if(error){
    body.innerHTML = `<div class="banner error">No se pudo cargar el historial. Revisá la conexión.</div>`;
    return;
  }
  if(!data.length){
    body.innerHTML = `<div class="empty">Todavía no se cerró ningún mes.<br>El primer cierre automático va a generar el primer historial acá.</div>`;
    return;
  }

  // Agrupar por mes
  const porMes = {};
  data.forEach(r=>{
    const key = r.mes;
    if(!porMes[key]) porMes[key] = [];
    porMes[key].push(r);
  });

  body.innerHTML = Object.keys(porMes).map(mesKey=>{
    const fecha = new Date(mesKey + 'T00:00:00');
    const nombreMes = fecha.toLocaleDateString('es-AR',{month:'long', year:'numeric'});
    const filas = porMes[mesKey].map(r=>`
      <div class="meta" style="padding:8px 0;border-bottom:1px solid var(--line);">
        <span>${r.municipio}</span>
        <span><b>${r.presentados_constancia}</b>/${r.cupo_total} const. — ${r.pases_asignados || 20} pases</span>
      </div>`).join('');
    return `<div class="lookup-card" style="margin-bottom:14px;">
        <h3 style="margin:0 0 10px;text-transform:capitalize;">${nombreMes}</h3>
        ${filas}
      </div>`;
  }).join('');
}

function renderList(){
  const list = document.getElementById('list');
  const activos = municipios.filter(m=>m.activo !== false);
  const inactivos = municipios.filter(m=>m.activo === false);

  if(!municipios.length){
    list.innerHTML = `<div class="empty">Todavía no cargaste ningún municipio.<br>Tocá el botón ＋ para agregar el primero.</div>`;
    return;
  }

  const cardHtml = (m)=>{
    const estado = estadoCupo(m.cupo_total, m.presentados_constancia);
    return `<div class="card admin ${estado.clase}" data-id="${m.id}" style="flex-direction:column;">
      <div style="display:flex;cursor:pointer;">
        <div class="stub">
          <div class="num">${m.remanente}<small>/${m.cupo_total}</small></div>
          <div class="label">Remanente</div>
          <div class="perf"></div>
        </div>
        <div class="body">
          <h3>${m.municipio}</h3>
          <div class="dots">${dotsHtml(m.cupo_total, m.presentados_constancia)}</div>
          <div class="meta">
            <span class="status-pill ${estado.pill}">${estado.texto}</span>
            <span>Act. ${fmtDate(m.actualizado)}</span>
          </div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">
            ${m.presentados_constancia}/${m.cupo_total} constancias — de ${m.pases_asignados || 20} pases asignados
          </div>
        </div>
      </div>
      ${warningHtml(m.ultima_presentacion)}
    </div>`;
  };

  let html = activos.map(cardHtml).join('');

  if(inactivos.length){
    html += `<div style="margin:22px 0 10px;font-size:13px;font-weight:600;color:var(--ink-soft);">
        Dados de baja por inactividad (${inactivos.length})
      </div>`;
    html += inactivos.map(cardHtml).join('');
  }

  list.innerHTML = html;

  list.querySelectorAll('.card').forEach(card=>{
    card.onclick = ()=> openEditModal(card.dataset.id);
  });
}

function openEditModal(id){
  const m = municipios.find(x=>String(x.id)===String(id));
  if(!m) return;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const inactivoBanner = m.activo === false
    ? `<div class="banner error" style="margin-bottom:14px;">Esta institución está dada de baja por 30+ días sin presentar. No aparece en la búsqueda pública hasta que la reactives.</div>`
    : '';
  bg.innerHTML = `<div class="modal">
      <h3>${m.municipio}</h3>
      ${inactivoBanner}
      <div class="field">
        <label>Cupo de constancias (lo que se completa y define el semáforo)</label>
        <input type="number" id="f-total" value="${m.cupo_total}" min="0">
      </div>
      <div class="field">
        <label>Constancias presentadas</label>
        <input type="number" id="f-pres" value="${m.presentados_constancia}" min="0">
      </div>
      <div class="field">
        <label>Pases totales asignados (dato informativo)</label>
        <input type="number" id="f-pases" value="${m.pases_asignados || 20}" min="0">
      </div>
      <div class="field">
        <label>Código de acceso del municipio (4 dígitos)</label>
        <input type="text" id="f-codigo" value="${m.codigo || ''}" maxlength="4" inputmode="numeric">
      </div>
      <div class="field">
        <label>Link de instalación para este municipio (les precarga su nombre, igual les va a pedir el código)</label>
        <input type="text" readonly value="${location.origin}${location.pathname}?municipio=${m.slug}" onclick="this.select()">
      </div>
      <div class="actions">
        <button class="btn-ghost" id="cancel-btn">Cancelar</button>
        <button class="btn-primary" id="save-btn">Guardar</button>
      </div>
      ${m.activo === false ? `
      <div class="actions" style="margin-top:8px;">
        <button class="btn-primary" id="reactivar-btn" style="width:100%;background:var(--green);">Reactivar en el sistema</button>
      </div>` : ''}
      <div class="actions" style="margin-top:8px;">
        <button class="btn-danger" id="del-btn" style="width:100%">Eliminar municipio</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.onclick = (e)=>{ if(e.target===bg) bg.remove(); };
  document.getElementById('cancel-btn').onclick = ()=> bg.remove();

  if(m.activo === false){
    document.getElementById('reactivar-btn').onclick = async ()=>{
      const { error } = await sb.from('cupos_municipios').update({
        activo: true, ultima_presentacion: new Date().toISOString(), actualizado: new Date().toISOString()
      }).eq('id', m.id);
      if(error){ alert('No se pudo reactivar. Revisá la conexión.'); return; }
      bg.remove();
      renderAdmin();
    };
  }

  document.getElementById('save-btn').onclick = async ()=>{
    const cupo_total = parseInt(document.getElementById('f-total').value)||0;
    const presentados_constancia = parseInt(document.getElementById('f-pres').value)||0;
    const pases_asignados = parseInt(document.getElementById('f-pases').value)||20;
    const codigo = document.getElementById('f-codigo').value.trim();
    const updateData = {
      cupo_total, presentados_constancia, pases_asignados, codigo, actualizado: new Date().toISOString()
    };
    // Solo actualiza "última presentación" si realmente sumaron pases presentados
    if(presentados_constancia > m.presentados_constancia){
      updateData.ultima_presentacion = new Date().toISOString();
    }
    const { error } = await sb.from('cupos_municipios').update(updateData).eq('id', m.id);
    if(error){ alert('No se pudo guardar. Revisá la conexión.'); return; }
    bg.remove();
    renderAdmin();
  };

  document.getElementById('del-btn').onclick = async ()=>{
    if(!confirm(`¿Eliminar ${m.municipio}? Esta acción no se puede deshacer.`)) return;
    const { error } = await sb.from('cupos_municipios').delete().eq('id', m.id);
    if(error){ alert('No se pudo eliminar. Revisá la conexión.'); return; }
    bg.remove();
    renderAdmin();
  };
}

function slugify(str){
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function openAddModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
      <h3>Agregar municipio</h3>
      <div class="field">
        <label>Nombre del municipio</label>
        <input type="text" id="f-nombre" placeholder="Ej. Tafí Viejo">
      </div>
      <div class="field">
        <label>Cupo de constancias</label>
        <input type="number" id="f-total" value="10" min="0">
      </div>
      <div class="field">
        <label>Pases totales asignados</label>
        <input type="number" id="f-pases" value="20" min="0">
      </div>
      <div class="actions">
        <button class="btn-ghost" id="cancel-btn">Cancelar</button>
        <button class="btn-primary" id="save-btn">Agregar</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.onclick = (e)=>{ if(e.target===bg) bg.remove(); };
  document.getElementById('cancel-btn').onclick = ()=> bg.remove();

  document.getElementById('save-btn').onclick = async ()=>{
    const nombre = document.getElementById('f-nombre').value.trim();
    const cupo_total = parseInt(document.getElementById('f-total').value)||10;
    const pases_asignados = parseInt(document.getElementById('f-pases').value)||20;
    if(!nombre){ alert('Ingresá el nombre del municipio'); return; }
    const slug = slugify(nombre);
    const codigo = String(Math.floor(1000 + Math.random()*9000));
    const { error } = await sb.from('cupos_municipios').insert({
      municipio: nombre, slug, cupo_total, presentados_constancia: 0, pases_asignados, codigo,
      actualizado: new Date().toISOString(), ultima_presentacion: new Date().toISOString()
    });
    if(error){ alert('No se pudo agregar. ¿El nombre ya existe? ' + error.message); return; }
    bg.remove();
    alert(`Municipio agregado. Código de acceso: ${codigo}`);
    renderAdmin();
  };
}

// ============ MANIFEST DINÁMICO (para que cada instalación abra en su propia pantalla) ============
(function setupManifest(){
  const base = location.origin + location.pathname.replace(/index\.html$/i, '');
  const isAdmin = params.get('admin') === '1';
  const preset = params.get('municipio') || params.get('m');

  let startUrl = base;
  let shortName = 'Cupos';
  let name = 'Cupos de Pases — Sección Discapacidad';
  if(isAdmin){
    startUrl = base + '?admin=1';
    shortName = 'Cupos Admin';
    name = 'Cupos — Panel Sección Discapacidad';
  } else if(preset){
    startUrl = base + '?municipio=' + encodeURIComponent(preset);
    shortName = 'Mi Cupo';
    name = 'Mi Cupo de Pases';
  }

  const manifest = {
    name, short_name: shortName,
    description: 'Seguimiento de cupos de pases por municipio',
    start_url: startUrl, scope: base,
    display: 'standalone', orientation: 'portrait',
    background_color: '#EEF1F3', theme_color: '#1C5D8C',
    icons: [
      { src: base + 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: base + 'icon-maskable-192.png', sizes: '192x192', type: 'image/png', purpose: 'maskable' },
      { src: base + 'icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
  const url = URL.createObjectURL(blob);
  let link = document.querySelector('link[rel="manifest"]');
  if(!link){ link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
  link.setAttribute('href', url);
})();

// ============ SERVICE WORKER (offline + instalable) ============
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// ============ ROUTER ============
const adminMode = params.get('admin') === '1';

if(session.authed){
  renderAdmin();
} else if(adminMode){
  renderLogin();
} else {
  renderLookup();
}
</script>
